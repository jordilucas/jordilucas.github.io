<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171127">
<meta name="description" content="Contagem regressiva para o lançamento de GTA VI.">
<title>Contagem Regressiva — GTA VI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#53204f,#171127 65%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.card{width:min(760px,100%);padding:clamp(22px,5vw,48px);border:1px solid #ed7dd966;border-radius:24px;background:#100d20d9;box-shadow:0 20px 80px #0008;text-align:center}
.kicker{letter-spacing:.28em;font-size:.76rem;color:#ff9bdd;font-weight:800}.logo{font-size:clamp(3rem,12vw,6rem);font-weight:1000;letter-spacing:.05em;line-height:1.1;margin:18px 0 8px;text-shadow:0 0 26px #f45cc8}.sub{color:#e4d8ed;margin:0 0 30px}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.unit{background:#ffffff0d;border:1px solid #ffffff26;border-radius:15px;padding:clamp(12px,3vw,22px) 4px}.num{font-size:clamp(2rem,7vw,4rem);font-weight:900;font-variant-numeric:tabular-nums;color:#ff9bdd}.unit:nth-child(2) .num,.unit:nth-child(3) .num{color:#fff}.label{font-size:.72rem;letter-spacing:.12em;margin-top:6px;color:#d9cbe6}.date{margin-top:28px;font-weight:800;letter-spacing:.08em}.note{font-size:.8rem;color:#cbbbd8;margin-top:8px}.track{height:4px;background:#ffffff20;border-radius:9px;margin-top:25px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,#ff79ca,#78e7ff)}.share{margin-top:24px;padding:12px 20px;border:0;border-radius:999px;background:#ff8bd7;color:#24112b;font-size:1rem;font-weight:800;cursor:pointer}.foot{font-size:.75rem;color:#bbaacb;margin-top:20px;line-height:1.5}a{color:#ff9bdd}
@media(max-width:420px){.timer{gap:6px}.label{font-size:.62rem;letter-spacing:.04em}.unit{border-radius:10px}}
</style>
</head>
<body>
<main class="card">
<div class="kicker">A ESPERA ESTÁ ACABANDO</div>
<div class="logo">GTA VI</div>
<p class="sub">Prepare-se para a próxima grande aventura.</p>
<div class="timer" aria-live="polite">
<div class="unit"><div class="num" id="days">--</div><div class="label">DIAS</div></div>
<div class="unit"><div class="num" id="hours">--</div><div class="label">HORAS</div></div>
<div class="unit"><div class="num" id="minutes">--</div><div class="label">MINUTOS</div></div>
<div class="unit"><div class="num" id="seconds">--</div><div class="label">SEGUNDOS</div></div>
</div>
<div class="date" id="status">19 DE NOVEMBRO DE 2026</div>
<div class="note">Contagem baseada na data anunciada · Horário de Brasília</div>
<div class="track"><div class="progress" id="progress"></div></div>
<button class="share" id="share">Compartilhar contagem</button>
<div class="foot">Fan countdown não oficial. Data sujeita a alterações pela Rockstar Games.<br><a href="https://www.rockstargames.com/VI" target="_blank" rel="noopener">Acompanhe os anúncios oficiais</a></div>
</main>
<script>
const target = new Date("2026-11-19T00:00:00-03:00").getTime();
const start = new Date("2026-10-26T00:00:00-03:00").getTime();
const $ = id => document.getElementById(id);
function tick(){
  const now = Date.now(), diff = Math.max(0,target-now);
  $("days").textContent = String(Math.floor(diff/86400000)).padStart(2,"0");
  $("hours").textContent = String(Math.floor(diff%86400000/3600000)).padStart(2,"0");
  $("minutes").textContent = String(Math.floor(diff%3600000/60000)).padStart(2,"0");
  $("seconds").textContent = String(Math.floor(diff%60000/1000)).padStart(2,"0");
  $("status").textContent = diff===0 ? "CHEGOU A HORA!" : "LANÇAMENTO: 19/11/2026";
  $("progress").style.width = Math.min(100,Math.max(0,(now-start)/(target-start)*100))+"%";
}
tick(); setInterval(tick,1000);
$("share").addEventListener("click",async()=>{
  const data={title:"Contagem regressiva GTA VI",text:"Acompanhe a contagem regressiva para GTA VI!",url:location.href};
  try{if(navigator.share) await navigator.share(data);else {await navigator.clipboard.writeText(location.href);$("share").textContent="Link copiado!";}}
  catch(e){}
});
</script>
</body>
</html>
